# Preview deploy for 2bitENT site — no extra secrets required.
# Live at: https://twobitEDD.github.io/ed-norris-portfolio/2bitent/

name: Deploy 2bitENT preview (GitHub Pages)

on:
  push:
    branches: [2bitent-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-2bitent-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bitent-site

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://twobitEDD.github.io/ed-norris-portfolio/2bitent
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
