# Deploy 2bitENT branch to Railway service 2bitent-com.
# Does NOT touch 2bitdev-portfolio on main.
#
# Requires GitHub repo secret: RAILWAY_TOKEN
# Create at https://railway.com/account/tokens

name: Deploy 2bitENT site

on:
  push:
    branches: [2bitent-site]
  workflow_dispatch:

concurrency:
  group: deploy-2bitent-site-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://2bitent.com

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.6.3

      - name: Deploy to 2bitent-com
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing."
            echo "Add it at: https://github.com/twobitEDD/ed-norris-portfolio/settings/secrets/actions"
            echo "Token from: https://railway.com/account/tokens"
            exit 1
          fi
          railway up \
            --service 9803a8a5-536f-44ab-aef6-21651ed48de9 \
            --environment production \
            --detach \
            --ci
