# Creates twobitEDD/2bitent-site from this branch and pushes standalone site code.

name: Publish 2bitent-site repository

on:
  workflow_dispatch:
  push:
    branches: [2bitent-site]
    paths:
      - ".github/workflows/publish-2bitent-site-repo.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bitent-site
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create twobitEDD/2bitent-site if missing and push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth status

          if gh repo view twobitEDD/2bitent-site >/dev/null 2>&1; then
            echo "Repository exists — pushing latest to main."
            git remote add ent "https://x-access-token:${GH_TOKEN}@github.com/twobitEDD/2bitent-site.git" 2>/dev/null || \
              git remote set-url ent "https://x-access-token:${GH_TOKEN}@github.com/twobitEDD/2bitent-site.git"
            git push ent HEAD:main --force
            echo "https://github.com/twobitEDD/2bitent-site"
            exit 0
          fi

          echo "Creating twobitEDD/2bitent-site..."
          gh repo create twobitEDD/2bitent-site \
            --public \
            --description "2bitENT.com — agency site" \
            --source=. \
            --remote=ent \
            --push

          echo "Published: https://github.com/twobitEDD/2bitent-site"
