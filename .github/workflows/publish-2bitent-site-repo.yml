# Publishes standalone 2bitENT site to twobitENT/twobitent-site.
#
# Requires GH_PAT (classic, repo scope) with twobitENT org access:
#   https://github.com/twobitEDD/ed-norris-portfolio/settings/secrets/actions
#
# Without GH_PAT, use "Export twobitent-site bundle" workflow instead (no secrets).

name: Publish twobitent-site repository

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target repo (owner/name)"
        required: false
        default: "twobitENT/twobitent-site"
  push:
    branches: [2bitent-site]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bitent-site

      - name: Prepare standalone history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Single-commit standalone history (no portfolio monorepo ancestry)
          git checkout --orphan standalone-main
          git add -A
          git commit -m "Initial commit: 2bitENT agency site"

      - name: Publish with GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET: ${{ github.event.inputs.target || 'twobitENT/twobitent-site' }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT not set — skipping automated publish."
            echo "Use workflow **Export twobitent-site bundle** (no secrets) or add GH_PAT."
            exit 0
          fi

          export GH_TOKEN="$GH_PAT"
          gh auth status

          if ! gh repo view "$TARGET" >/dev/null 2>&1; then
            echo "Creating ${TARGET}..."
            gh repo create "$TARGET" \
              --public \
              --description "2bitENT.com — AI-augmented production studio"
          fi

          git remote add ent "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" 2>/dev/null || \
            git remote set-url ent "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git"
          git push ent standalone-main:main --force

          echo "Published: https://github.com/${TARGET}"
